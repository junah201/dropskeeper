# 소개 사이트(apps/site)를 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로, Custom domain을 dropskeeper.junah.dev로 둔다.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/legal/**
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @dropskeeper/site...
      - run: pnpm site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
