  copyCode: Copy code
  pause: Pause
  resume: Resume
  stop: Stop
  waiting: Waiting
  failed: Failed
  succeeded: Succeeded
  redeemed: Redeemed
  keepsRunning: Keeps running even if you close the popup
  openInventory: Open {name} drops inventory
  openRedeemPage: Open Battle.net redeem page
  unknownError: Unknown error

step:
  collect: Collect
  redeem: Redeem

expiry:
  today: D-day
  daysLeft: D-{days}
  expiresOn: Expires {date}

home:
  title: Open this on a drops page or the Battle.net redeem page
  description: Collect codes from your drops inventory, then redeem them all at once on the Battle.net redeem page.
  extractRunning: Extracting codes
  extractPaused: Code extraction paused
  redeemRunning: Redeeming codes
  redeemPaused: Redeeming paused
  goToJobTab: Go to job tab
  statExtracted: Codes extracted
  statPending: Waiting to redeem
  statRedeemed: Redeemed
  statFailed: Failed to redeem

source:
  introTitle: "Import Overwatch rewards\nfrom your {name} drops inventory"
  introDescription: Loads your reward list with the account you're signed in to. In the next step, codes are extracted only for the rewards you choose.
  loading: Loading
  loadingShort: Loading…
  load: Load rewards
  reload: Reload
  loadHint: Only Overwatch code rewards that haven't expired are imported
  extract: Extract codes ({count})
  shownOfTotal: '· Showing {shown} of {total}'
  hideClaimed: Hide claimed
  selectUnclaimed: Select unclaimed ({count})
  hideExtracted: Hide extracted
  noMatch: No rewards match these filters
  lastLoaded: Last loaded {time}
  tagExtracted: Extracted
  tagExtractFailed: Extract failed
  tagClaimed: Claimed
  tagNotExtracted: Not extracted

extracting:
  running: Extracting codes
  paused: Extraction paused
  requesting: Requesting…

extractDone:
  stopped: Extraction stopped
  done:
    1: Saved 1 code to DropsKeeper
    n: Saved $1 codes to DropsKeeper
  description: They're not on Battle.net yet. You don't need to paste them. DropsKeeper redeems them for you.
  nextTitle: Next, redeem them
  step1: Click the button below to open the Battle.net redeem page
  step2: Click "Redeem now" in the prompt at the top right
  stepHint: Don't see the prompt? Click the DropsKeeper icon in your browser toolbar instead.
  goRedeem: Redeem on Battle.net
  statOk: Saved
  retryAll: Retry all failed ({count})
  backToList: Back to list

redeem:
  emptyTitle: No codes to redeem
  emptyDescription: Load rewards from a drops inventory and extract codes, and they'll show up here.
  deleteSelected: Remove selected codes from the list
  start: Redeem ({count})
  pendingCount: '· {count} waiting'
  loginFirst: Sign in to Battle.net first
  lastAttempt: 'Last attempt: {reason}'
  pacingHint: 0.5–1s between codes · redeems one at a time in this tab
  running: Redeeming
  paused: Redeeming paused
  remaining: Left
  nextIn: 'Next code in {seconds}s · '
  statusRunning: Redeeming…
  statusSkipped: Skipped
  statusIn: In {seconds}s
  retryFailed: Retry failed ({count})
  deleteHopeless: Remove non-retryable ({count})
  backToQueue: Back to queue
