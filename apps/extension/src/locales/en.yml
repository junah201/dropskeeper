# 기본 언어(default_locale). 브라우저 언어가 ko도 en도 아니면 이 파일이 쓰인다.
# 키 타입은 이 파일에서 만들어지므로 새 문구는 여기에 먼저 추가하고 ko.yml에도 같은 키를 넣는다.

# 지금 쓰이는 번역 언어. <html lang>과 정렬에 쓴다.
lang: en

extName: DropsKeeper
extDescription: Collects the drop reward codes you earn watching SOOP and CHZZK streams and redeems them on Battle.net for you, one by one.

