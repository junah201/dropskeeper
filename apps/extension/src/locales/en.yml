    1: Redeeming stopped. 1 code was not tried.
    n: Redeeming stopped. $1 codes were not tried.
  noFailures: No failed codes
  noSuccesses: No redeemed codes
  rawMessage: 'Original: {text}'

# Battle.net 등록 실패 이유. 이름과 도움말
reason:
  already_used:
    label: Code already used
    help: This code has already been redeemed. Trying again won't work.
  already_owned:
    label: Already owned
    help: This account already owns this item.
  expired:
    label: Code expired
    help: This code has expired and can't be redeemed anymore.
  not_redeemable:
    label: Code can't be redeemed
    help: Battle.net may be under maintenance. Try again later.
  product_unavailable:
    label: Item can't be redeemed
    help: Battle.net didn't say why. Try redeeming it yourself.
  unknown:
    label: Unknown error
    help: Check the original message below, then try again or redeem it yourself.

card:
  details: Open DropsKeeper
  close: Close
  starting: Starting…
  extractFound:
    1: 1 code ready to extract
    n: $1 codes ready to extract
  extractFoundDescription: Codes are saved to DropsKeeper, and {name} will show these rewards as claimed.
  extractStart: Extract now
  extracting: Extracting codes {done}/{total}
  extractingDescription: Keep this tab open until it finishes.
  extractDoneDescription: They're not on Battle.net yet. Go to the redeem page to finish.
  extractSomeFailed: "{count} couldn't be extracted. Open DropsKeeper to try again."
  extractNone: Couldn't extract any codes
  extractNoneDescription: Open DropsKeeper to see why, then try again.
  redeemFound:
    1: 1 code ready to redeem
    n: $1 codes ready to redeem
  redeemDescription: DropsKeeper redeems them one by one in this tab. Open DropsKeeper to see progress.
  redeemStart: Redeem now

settings:
  maskCodes: Hide codes
  maskCodesDescription: Hides the middle of codes in lists. The copy button always copies the full code.
  pageHints: Show on-page prompts
  pageHintsDescription: Shows codes to extract on your drops inventory and codes to redeem on the Battle.net redeem page. Your reward list is checked automatically when you open the inventory.
  site: Website
  privacy: Privacy Policy
  terms: Terms of Service

# background·content script가 만들어 popup에 넘기는 문구 (LocalText)
msg:
  popupDisconnected: Couldn't reach the extension. Reopen the popup.
  pageDisconnected: Couldn't connect to the page. Refresh the inventory page and try again.
  listFailed: Couldn't load the reward list.
  jobAlreadyRunning: Another job is already running.
  jobInterrupted: The job was interrupted. Press Resume to continue.
  tabClosed: The tab used for this job was closed.
  sourceDisconnected: Lost connection to the drops page. Reopen the inventory page.
  battlenetLogin: Sign in to Battle.net, then press Resume.
  tooManyUnknown: Stopped after {count} unknown errors in a row. Check the page.
  noExtractedCode: No extracted code.
  noPendingCodes: No codes to redeem. Extract codes from your drops inventory first.
  noExtractableCodes: No codes to extract. They're already extracted or expired.
  popupOpenFailed: Couldn't open DropsKeeper. Click its icon in your browser toolbar.
  resultUnconfirmed: Pressed the confirm button but couldn't read the result.
  pageUnreadable: "Couldn't read the page: {text}"
  redeemPageMissing: Couldn't find the redeem page.
  serverUnreachable: Couldn't connect to {name}.
  notLoggedIn: You're not signed in to {name}.
  httpError: '{name} responded with an error (HTTP {status})'
  requestFailed: '{name} request failed.'
  requestFailedCode: '{name} request failed. ({code})'
  unexpectedFormat: The {name} reward list came back in an unexpected format.
  noCodeInResponse: The response didn't include a code.
  tooManyRewards: Too many rewards to load the full list.
  unsupportedBattlenetPage: Open the Battle.net redeem page in Korean or English to redeem codes.
